<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0L9 4L0 8z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#94a3b8" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1500" height="900" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="750" y="62" text-anchor="middle" font-size="32" font-weight="700">Pixel12 Web Level 0 DFD</text>
    <text x="750" y="94" text-anchor="middle" font-size="16" fill="#526174">Context diagram for the image-to-frontend code generation system</text>

    <g filter="url(#shadow)" stroke-width="2">
      <rect x="105" y="335" width="250" height="150" rx="16" fill="#eef2ff" stroke="#818cf8"/>
      <rect x="570" y="275" width="360" height="270" rx="28" fill="#e0f2fe" stroke="#38bdf8"/>
      <rect x="1145" y="210" width="250" height="150" rx="16" fill="#ecfdf5" stroke="#34d399"/>
      <rect x="1145" y="540" width="250" height="150" rx="16" fill="#fff7ed" stroke="#fb923c"/>
    </g>

    <g text-anchor="middle">
      <text x="230" y="380" font-size="22" font-weight="700">User</text>
      <text x="230" y="414" font-size="16">Uploads UI image</text>
      <text x="230" y="442" font-size="16">Selects output format</text>

      <text x="750" y="365" font-size="24" font-weight="700">0. Pixel12 Web</text>
      <text x="750" y="405" font-size="17">Image-to-frontend</text>
      <text x="750" y="433" font-size="17">code generator</text>
      <text x="750" y="480" font-size="14" fill="#526174">Validates, transforms, and returns</text>
      <text x="750" y="504" font-size="14" fill="#526174">generated frontend code</text>

      <text x="1270" y="255" font-size="22" font-weight="700">OpenRouter AI</text>
      <text x="1270" y="289" font-size="16">Receives prompt</text>
      <text x="1270" y="317" font-size="16">and image data</text>

      <text x="1270" y="585" font-size="22" font-weight="700">Generated Output</text>
      <text x="1270" y="619" font-size="16">HTML + Tailwind CSS</text>
      <text x="1270" y="647" font-size="16">Live preview and code</text>
    </g>

    <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M355 380H570"/>
      <path d="M930 360L1145 285"/>
      <path d="M1145 625H930"/>
      <path d="M570 470L355 440"/>
    </g>
    <g font-size="14" fill="#475569">
      <text x="410" y="365">Image + format</text>
      <text x="980" y="312">Prompt + image</text>
      <text x="990" y="608">Generated code</text>
      <text x="405" y="470">Preview + code</text>
    </g>

    <g transform="translate(590 760)" font-size="14" fill="#526174">
      <circle cx="12" cy="0" r="8" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
      <text x="30" y="5">External user</text>
      <circle cx="205" cy="0" r="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
      <text x="223" y="5">Main system</text>
      <circle cx="380" cy="0" r="8" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
      <text x="398" y="5">External service</text>
      <circle cx="590" cy="0" r="8" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
      <text x="608" y="5">Output</text>
    </g>
