<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#475569"/></marker></defs><rect width="1500" height="950" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172033"><text x="750" y="60" text-anchor="middle" font-size="32" font-weight="700">Pixel12 Web Project Sequence Diagram</text><text x="750" y="91" text-anchor="middle" fill="#526174">Image upload → validation → OpenRouter generation → preview</text><g stroke="#94a3b8" fill="#f8fafc" stroke-width="2"><rect x="100" y="140" width="130" height="700"/><rect x="380" y="140" width="130" height="700"/><rect x="680" y="140" width="130" height="700"/><rect x="980" y="140" width="150" height="700"/><rect x="1270" y="140" width="130" height="700"/></g><g font-size="18" font-weight="700" text-anchor="middle"><text x="165" y="175">User</text><text x="445" y="175">Browser</text><text x="745" y="175">Flask App</text><text x="1055" y="175">OpenRouter API</text><text x="1335" y="175">Preview</text></g><g stroke="#334155" stroke-width="2"><path d="M165 190V815"/><path d="M445 190V815"/><path d="M745 190V815"/><path d="M1055 190V815"/><path d="M1335 190V815"/></g><g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M165 230H445"/><path d="M445 330H745"/><path d="M745 420H1055"/><path d="M745 520H1055"/><path d="M1055 620H745"/><path d="M745 700H445"/><path d="M445 750H1335"/></g><g stroke="#64748b" stroke-width="2" stroke-dasharray="8 8" fill="none" marker-end="url(#a)"><path d="M445 275H165"/><path d="M745 370H445"/><path d="M745 570H445"/><path d="M445 800H165"/></g><g font-size="14" fill="#334155"><text x="270" y="215">Upload image</text><text x="260" y="265">Show selected image</text><text x="560" y="315">POST /generate</text><text x="870" y="405">validate_and_encode_image()</text><text x="860" y="505">chat.completions.create(prompt, image)</text><text x="855" y="605">AI-generated HTML + Tailwind CSS</text><text x="560" y="685">JSON { code: ... }</text><text x="900" y="735">Render preview or show code tab</text><text x="260" y="790">Result displayed</text><rect x="100" y="860" width="1300" height="60" rx="14" fill="#eef2ff" stroke="#a5b4fc"/><text x="130" y="896">Sequence summary:</text><text x="300" y="896">User uploads an image → Browser sends request → Flask validates image → OpenRouter generates HTML → Browser shows preview/code.</text></g></g></svg>