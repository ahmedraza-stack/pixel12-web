<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
	<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#475569"/></marker></defs>
	<rect width="1500" height="900" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#172033">
		<text x="750" y="60" text-anchor="middle" font-size="32" font-weight="700">Pixel12 Web Project DFD Diagram</text><text x="750" y="91" text-anchor="middle" font-size="16" fill="#526174">Data flow from image upload to generated frontend code</text>
		<g stroke-width="2"><rect x="100" y="280" width="180" height="120" rx="18" fill="#f8fafc" stroke="#94a3b8"/><rect x="420" y="240" width="220" height="200" rx="18" fill="#e0f2fe" stroke="#38bdf8"/><rect x="760" y="240" width="240" height="200" rx="18" fill="#e0f2fe" stroke="#38bdf8"/><rect x="1140" y="250" width="220" height="180" rx="18" fill="#ecfdf5" stroke="#34d399"/><rect x="760" y="520" width="240" height="160" rx="18" fill="#e0f2fe" stroke="#38bdf8"/><rect x="1140" y="530" width="220" height="150" rx="18" fill="#ecfdf5" stroke="#34d399"/></g>
		<g font-size="16" text-anchor="middle"><text x="190" y="325" font-size="18" font-weight="700">User</text><text x="190" y="355">Uploads UI image</text><text x="530" y="290" font-size="18" font-weight="700">Process 1</text><text x="530" y="325">Web Interface</text><text x="530" y="350">(index.html + script.js)</text><text x="530" y="390">Collects image and</text><text x="530" y="415">target language</text><text x="880" y="290" font-size="18" font-weight="700">Process 2</text><text x="880" y="325">Flask Server</text><text x="880" y="350">(app.py)</text><text x="880" y="390">Validates image</text><text x="880" y="415">and calls OpenRouter</text><text x="1250" y="305" font-size="18" font-weight="700">Data Store</text><text x="1250" y="340">Environment</text><text x="1250" y="365">Configuration</text><text x="1250" y="395">OPENROUTER_API_KEY</text><text x="880" y="570" font-size="18" font-weight="700">Process 3</text><text x="880" y="610">OpenRouter API</text><text x="880" y="640">Generates code</text><text x="880" y="665">from the image</text><text x="1250" y="585" font-size="18" font-weight="700">Generated Output</text><text x="1250" y="620">HTML + Tailwind CSS</text></g>
		<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M280 340H420"/><path d="M640 340H760"/><path d="M880 440V520"/><path d="M1000 600H1140"/><path d="M1250 430V530"/></g>
